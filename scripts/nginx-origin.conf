server {
    listen 127.0.0.1:3184;
    server_name _;
    root /opt/deep-surge-lab/current;
    index index.html;
    autoindex off;
    location ~ /\. { return 404; }
    location = /deep-surge-lab { return 308 /deep-surge-lab/; }
    location /deep-surge-lab/ {
        rewrite ^/deep-surge-lab/$ /index.html break;
        rewrite ^/deep-surge-lab/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /deep-surge-editor { return 308 /deep-surge-editor/; }
    location /deep-surge-editor/src/ {
        rewrite ^/deep-surge-editor/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /deep-surge-editor/config/ {
        rewrite ^/deep-surge-editor/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /deep-surge-editor/ {
        rewrite ^/deep-surge-editor/$ /editor/index.html break;
        rewrite ^/deep-surge-editor/(.*)$ /editor/$1 break;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}

